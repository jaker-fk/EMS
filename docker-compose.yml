# 生产/开发通用的 Docker Compose 编排。
# 数据库与 Redis 只绑定 127.0.0.1，避免把 3307/6379 暴露到公网；生产环境请用反向代理 + HTTPS 暴露前端。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DB:-admin_panel}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主机用 3307，避免与本机已安装的 MySQL(3306) 冲突；只绑本机回环地址
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: admin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: admin-panel-backend:2.1.0
    container_name: admin-backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Admin Panel API}
      # 生产环境请设为 prod：关闭 Swagger、不灌演示数据、校验 SECRET_KEY
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:-please-change-this-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DB: ${MYSQL_DB:-admin_panel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_REQUIRED: ${REDIS_REQUIRED:-false}
      DB_URL: ""
      UPLOAD_DIR: /app/uploads
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      SEED_BASE_DATA: ${SEED_BASE_DATA:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    stop_grace_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        # 国内网络默认走镜像源，海外构建可设 NPM_REGISTRY=https://registry.npmjs.org
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: admin-panel-frontend:2.1.0
    container_name: admin-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  uploads:
