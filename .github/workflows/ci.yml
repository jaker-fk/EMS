name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: 代码规范（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt
      - name: ruff
        working-directory: backend
        run: ruff check .

  backend:
    name: 后端测试（SQLite + MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admin_panel_test
          MYSQL_USER: admin
          MYSQL_PASSWORD: "123456"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt

      - name: 单元 / 接口测试（SQLite）
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

      - name: 校验 Alembic 迁移（空库升级 + 模型无漂移）
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: admin
          MYSQL_PASSWORD: "123456"
          MYSQL_DB: admin_panel_test
        run: |
          alembic upgrade head
          alembic check

      - name: 接口测试（MySQL）
        working-directory: backend
        env:
          TEST_DB_URL: mysql+pymysql://admin:123456@127.0.0.1:3306/admin_panel_test?charset=utf8mb4
        run: pytest -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖（npm ci）
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: 类型检查 + 构建
        working-directory: frontend
        run: npm run build

  docker:
    name: 镜像构建校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: admin-panel-backend:ci
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: admin-panel-frontend:ci
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
