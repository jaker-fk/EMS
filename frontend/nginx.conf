server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # 后台上传接口允许 10MB，Nginx 默认只有 1MB，不改这里超过 1MB 的图片会直接 413
  client_max_body_size 12m;

  # 安全响应头（location 里不要再写 add_header，否则会覆盖这里的继承）
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # img-src 放开 https：师资头像 / 资讯封面允许填外链图片；脚本与接口仍只允许本站
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1k;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://backend:8000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 指标端点只在内网抓取，不通过公网入口暴露
  location = /metrics {
    return 404;
  }

  # 打包产物带 hash，可以放心长缓存
  location /assets/ {
    expires 30d;
  }

  # 入口 HTML 不缓存，避免发版后仍引用旧 chunk
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
